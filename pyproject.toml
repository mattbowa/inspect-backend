[tool.poetry]
name = "seo-agent"
version = "0.1.0"
description = "AI-powered SEO auditing platform"
authors = []

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
watchfiles = "^0.21"
celery = {extras = ["redis"], version = "^5.3.6"}
qdrant-client = "^1.9.0"
anthropic = "^0.40.0"
fastembed = "^0.3.6"
playwright = "^1.44.0"
beautifulsoup4 = "^4.12.3"
httpx = "^0.27.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.2.1"
redis = "^5.0.4"
sqlalchemy = "^2.0"
alembic = "^1.13.0"
psycopg2-binary = "^2.9"
tenacity = "^8.3.0"
structlog = "^24.1.0"
stripe = "^10.0.0"
resend = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
